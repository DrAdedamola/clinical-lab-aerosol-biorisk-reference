# ---------------------------------------------------------------------------
# Purchasable standard. Recorded separately and NOT counted among open sources.
# ---------------------------------------------------------------------------
standards:
  ISO35001:
    type: standard
    title: "ISO 35001:2019, Biorisk management for laboratories and other related organisations"
    authors: "International Organization for Standardization, Technical Committee 212"
    author_note: "Corporate author."
    published: "2019-11"
    url_contents_page: "https://cdn.standards.iteh.ai/samples/71293/7c24ea0b07544c1f8e7c05ceb4774e4b/ISO-35001-2019.pdf"
    access_date: "2026-10-29"
    access_note: >
      NOT an openly accessible source. The standard must be purchased from ISO or a
      national member body. Only the clause numbers and titles are used here, taken from
      the publicly posted contents page, as a structural index.
    terms_of_use: >
      Copyright ISO. This project reproduces clause NUMBERS and TITLES only. No
      requirement text, figure or definition from the standard is reproduced anywhere in
      this repository.
    used_for: ["clause mapping"]

# ---------------------------------------------------------------------------
# Identified but NOT verified at source. Cited nowhere. Excluded from every score.
# ---------------------------------------------------------------------------
pending_verification:
  CUNNINGHAM_PATEL:
    note: >
      Reported secondhand to have shown that a direct smear with matrix solution alone
      prevents growth of Brucella species on a MALDI-TOF target. Found only at second
      hand and therefore EXCLUDED from the evidence table and from every score in this
      release. Because the claim is load-bearing for the S06 control set, the S06
      recommendation is deliberately more cautious than the full evidence may warrant.
      To be located, read at source and reconsidered in release 2.
  BANADA_METHODS:
    note: >
      The S05 claim that an incorrect-use condition was simulated by omitting the
      recommended sample reagent incubation was drawn from a secondary description, not
      from the Banada methods section. The abstract describes no such condition, and the
      sterilising variable in that work is the sample reagent to sputum ratio rather than
      contact time. The claim was WITHDRAWN on 2026-10-29 and the S05 evidence row now
      rests on the bioaerosol comparison alone. To be resolved by reading the methods
      section at source.
  BSC_CERTIFICATION_STANDARD:
    note: >
      The C3 anchor refers to annual field certification of biological safety cabinets to
      a recognised standard. This release deliberately does not name the standard
      designation or the interval, because neither was confirmed at source; the control
      sets instead require the laboratory to record which standard and interval it
      applies. To be confirmed at source and named in release 2.
